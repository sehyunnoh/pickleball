<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Oakville Pickleball">
  <!--
    The tab mark: a pickleball, holes and all.

    Court green is kept scarce everywhere else on the site so that it still
    means something where it does appear — a brand mark has earned it. A
    full-bleed square rather than a rounded tile, for the same reason the site
    has no rounded cards.

    Drawn for 16px, where every decision here was made:

    - Five holes, not a real ball's dozen. Checked against the actual 16px
      rasterisation: seven or more merge into a single grey smudge and the
      thing stops reading as perforated at all.
    - Five in a pentagon rather than three. Three large holes is legible, but
      three holes in a triangle is a bowling ball, and being crisply mistaken
      for the wrong sport is worse than being slightly soft.
    - Not four-plus-centre either: that resolves into a plus sign.
    - The ball nearly fills the square, so the white survives the downscale.

    `favicon.ico` beside this file is rasterised from it at 16/32/48 for old
    Safari and for the crawlers that ask for /favicon.ico regardless of what
    the <link> tags say. Modern browsers take the SVG. If this drawing changes,
    regenerate the .ico rather than editing it — the two must not drift.
  -->
  <rect width="32" height="32" fill="#2c6b47" />
  <circle cx="16" cy="16" r="13" fill="#fbfaf7" />
  <g fill="#2c6b47">
    <circle cx="16" cy="8.6" r="3.1" />
    <circle cx="23.04" cy="13.71" r="3.1" />
    <circle cx="20.35" cy="21.99" r="3.1" />
    <circle cx="11.65" cy="21.99" r="3.1" />
    <circle cx="8.96" cy="13.71" r="3.1" />
  </g>
</svg>
