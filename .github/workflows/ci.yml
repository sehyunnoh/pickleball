name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight. Content batches arrive as a series
# of small commits and there is no value in finishing checks for a diff that
# no longer exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Content first: it is the check most likely to fail on a content PR and
      # the fastest to run, so failing here saves the rest of the job.
      - name: Validate content
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `npm run build` would re-run validate; next build directly instead.
      - name: Build
        run: npx next build
